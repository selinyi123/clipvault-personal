# Incognito/no-learning twin of clipvault_pinyin. It shares the audited base
# dictionary but never opens or updates a Rime user dictionary.
schema:
  schema_id: clipvault_pinyin_private
  name: ClipVault Pinyin Private
  version: "2"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, English ]

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/

translator:
  dictionary: pinyin_simp
  enable_completion: true
  enable_sentence: true
  enable_user_dict: false
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: clipvault_punctuation
