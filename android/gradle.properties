org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# This repository is often checked out from a Windows path with non-ASCII
# characters; keep local agent/Owner verification runnable from that workspace.
android.overridePathCheck=true
# AGP 8.5 is retained for the v1.x branch compatibility surface while the v2
# APKs are compiled and targeted against the Android 16 / API 36 contract.
android.suppressUnsupportedCompileSdk=36
