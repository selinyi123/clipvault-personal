name: Sohu Frontend Pagination Probe

on:
  push:
    paths:
      - '.github/workflows/lmcmr-crawl.yml'
      - 'tmp/sohu_frontend_probe.py'
  workflow_dispatch:

concurrency:
  group: lmcmr-crawl
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - run: python tmp/sohu_frontend_probe.py
      - name: Persist frontend snippets
        run: |
          mkdir -p tmp/sohu-frontend-probe
          cp sohu_frontend_probe.json tmp/sohu-frontend-probe/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/sohu-frontend-probe/result.json
          git commit -m 'Update Sohu frontend pagination probe' || exit 0
          git push
