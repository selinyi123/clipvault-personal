name: LMCMR Crawl

on:
  push:
    paths:
      - '.github/workflows/lmcmr-crawl.yml'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler deps
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Crawl LMCMR search index
        run: |
          python - <<'PY'
          import csv, json, re, time
          from datetime import datetime
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          BASE='https://www.lmcmr.com'
          SEARCHID='12031'
          START=datetime(2025,1,1)
          END=datetime(2026,8,19,23,59,59)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; LMCMR-index-research/1.0)'})
          rows=[]
          seen=set()
          page=0
          max_pages=700
          empty_streak=0
          oldest=None
          newest=None
          date_re=re.compile(r'\b(20\d{2}-\d{2}-\d{2})\b')

          while page < max_pages:
              url=f'{BASE}/e/search/result/?page={page}&searchid={SEARCHID}'
              r=s.get(url,timeout=30)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              page_rows=[]

              for h2 in soup.select('h2.r'):
                  a=h2.find('a',class_='l',href=True)
                  if not a:
                      continue
                  title=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(BASE,a['href'])
                  if href in seen:
                      continue

                  table=h2.find_next_sibling('table')
                  if table is None:
                      continue
                  span=table.find('span',class_='a')
                  if span is None:
                      continue
                  meta=' '.join(span.get_text(' ',strip=True).split())
                  matches=date_re.findall(meta)
                  if not matches:
                      continue
                  # In LMCMR search results the final YYYY-MM-DD in span.a is the update date;
                  # the path before it may itself contain a creation-date segment.
                  update_date=matches[-1]
                  dt=datetime.strptime(update_date,'%Y-%m-%d')
                  page_rows.append((dt,title,href))
                  seen.add(href)
                  if START <= dt <= END:
                      rows.append({'date':update_date,'title':title,'url':href,'source_page':page})

              if not page_rows:
                  empty_streak += 1
                  print(f'page={page} no parsed rows',flush=True)
              else:
                  empty_streak = 0
                  oldest=min(x[0] for x in page_rows)
                  newest=max(x[0] for x in page_rows)
                  print(f'page={page} count={len(page_rows)} range={oldest.date()}..{newest.date()} total_kept={len(rows)}',flush=True)
                  if newest < START:
                      break

              if empty_streak >= 3:
                  break
              page += 1
              time.sleep(0.15)

          rows.sort(key=lambda x:(x['date'],x['title']),reverse=True)
          out=[]; keys=set()
          for x in rows:
              k=(x['url'],x['date'])
              if k in keys:
                  continue
              keys.add(k)
              out.append(x)

          with open('lmcmr_2025-01-01_2026-08-19.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          with open('lmcmr_2025-01-01_2026-08-19.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['date','title','url','source_page'])
              w.writeheader(); w.writerows(out)
          summary={
              'count':len(out),
              'last_page':page,
              'oldest_seen':oldest.strftime('%Y-%m-%d') if oldest else None,
              'newest_seen':newest.strftime('%Y-%m-%d') if newest else None,
              'searchid':SEARCHID,
              'range_start':'2025-01-01',
              'range_end':'2026-08-19'
          }
          with open('lmcmr_summary.json','w',encoding='utf-8') as f:
              json.dump(summary,f,ensure_ascii=False,indent=2)
          print('FINAL_COUNT',len(out),flush=True)
          print('LAST_PAGE',page,'OLDEST',oldest.date() if oldest else None,'NEWEST',newest.date() if newest else None,flush=True)
          PY
      - name: Persist results to repository
        run: |
          mkdir -p tmp/lmcmr-crawl
          cp lmcmr_2025-01-01_2026-08-19.json tmp/lmcmr-crawl/
          cp lmcmr_2025-01-01_2026-08-19.csv tmp/lmcmr-crawl/
          cp lmcmr_summary.json tmp/lmcmr-crawl/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/lmcmr-crawl
          git commit -m 'Update LMCMR crawl results' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: lmcmr-crawl
          path: tmp/lmcmr-crawl/
          retention-days: 7
