name: LM / Sohu History Crawl

on:
  push:
    paths:
      - '.github/workflows/lmcmr-crawl.yml'
      - 'tmp/sohu_lm_crawl.py'
  workflow_dispatch:

concurrency:
  group: lmcmr-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mark crawl running
        run: |
          mkdir -p tmp/sohu-lm-crawl
          printf '{"status":"running","started_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > tmp/sohu-lm-crawl/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/sohu-lm-crawl/status.json
          git commit -m 'Sohu LM crawl running' || true
          git push
      - name: Install dependency
        run: python -m pip install --quiet requests
      - name: Crawl public Sohu author history
        run: python tmp/sohu_lm_crawl.py
      - name: Persist results
        run: |
          cp sohu_summary.json tmp/sohu-lm-crawl/summary.json
          cp sohu_summary.json tmp/sohu-lm-crawl/status.json
          cp sohu_all.json tmp/sohu-lm-crawl/all.json
          cp sohu_selected.json tmp/sohu-lm-crawl/2025-01-01_2026-08-19.json
          cp sohu_selected.csv tmp/sohu-lm-crawl/2025-01-01_2026-08-19.csv
          git add tmp/sohu-lm-crawl
          git commit -m 'Update Sohu LM crawl results' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: sohu-lm-crawl
          path: tmp/sohu-lm-crawl/
          retention-days: 7
