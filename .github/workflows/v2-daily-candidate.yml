name: V2 daily-use automated candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-daily-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop_candidate:
    name: Desktop tests and unsigned portable candidate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/packaging/windows-release-requirements.txt

      - name: Resolve hash-locked Windows dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packaging/wheelhouse | Out-Null
          python -m pip download --require-hashes --only-binary=:all: --dest packaging/wheelhouse --requirement packaging/windows-release-requirements.txt
          python -m venv .venv-build
          & .\.venv-build\Scripts\python.exe -m pip install --no-index --find-links packaging/wheelhouse --require-hashes --requirement packaging/windows-release-requirements.txt
          & .\.venv-build\Scripts\python.exe -m pip check
          python -m venv .venv-test
          & .\.venv-test\Scripts\python.exe -m pip install "pytest>=8.0"
          & .\.venv-test\Scripts\python.exe -m pip check

      - name: Export locked wheel notices
        working-directory: desktop
        shell: pwsh
        run: |
          .\packaging\Export-WheelNotices.ps1 `
            -Wheelhouse packaging/wheelhouse `
            -Destination packaging/runtime-notices

      - name: Run Desktop and contract tests
        working-directory: desktop
        shell: pwsh
        run: .\.venv-test\Scripts\python.exe -m pytest -q

      - name: Build unsigned portable executable
        working-directory: desktop
        shell: pwsh
        run: |
          & .\.venv-build\Scripts\python.exe -m PyInstaller `
            --clean --noconfirm --onefile --name clipvault `
            --hide-console hide-early `
            --icon "$PWD/packaging/clipvault.ico" `
            --hidden-import pystray._win32 `
            --workpath build_pyi `
            --specpath packaging `
            --add-data "$PWD/clipvault/store/migrations;clipvault/store/migrations" `
            --add-data "$PWD/clipvault/api/webui;clipvault/api/webui" `
            --add-data "$PWD/../THIRD_PARTY_NOTICES.md;." `
            --add-data "$PWD/../third_party;third_party" `
            --add-data "$PWD/packaging/runtime-notices;third_party/licenses" `
            packaging/run_clipvault.py
          if ($LASTEXITCODE -ne 0) { throw "Desktop candidate build failed with exit code $LASTEXITCODE" }

      - name: Verify and stage unsigned Desktop candidate
        shell: pwsh
        run: |
          $report = @(& .\desktop\dist\clipvault.exe --self-test-tray 2>&1)
          if ($LASTEXITCODE -ne 0 -or $report -notcontains 'tray self-test ok') {
            throw 'Frozen Desktop tray self-test failed.'
          }
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'artifacts\v2-daily\desktop'
          New-Item -ItemType Directory -Path $candidate -Force | Out-Null
          Copy-Item -LiteralPath .\desktop\dist\clipvault.exe `
            -Destination (Join-Path $candidate 'ClipVault-Desktop-v2-unsigned.exe')
          Copy-Item -LiteralPath .\desktop\packaging\runtime-notices `
            -Destination (Join-Path $candidate 'runtime-notices') -Recurse
          $portable = Join-Path $candidate 'ClipVault-Desktop-v2-unsigned.exe'
          $hash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($portable))" |
            Set-Content -LiteralPath (Join-Path $candidate 'SHA256SUMS.txt') -Encoding ASCII

      - name: Upload unsigned Desktop candidate
        uses: actions/upload-artifact@v7
        with:
          name: clipvault-v2-desktop-unsigned-candidate
          path: artifacts/v2-daily/desktop/
          if-no-files-found: error
          retention-days: 14

  android_native:
    name: Android locked native production gate
    uses: ./.github/workflows/v2-ime-production.yml

  windows_native:
    name: Windows locked native production gate
    uses: ./.github/workflows/windows-ime-native-slice.yml

  automated_readiness:
    name: Aggregate automated readiness
    needs: [desktop_candidate, android_native, windows_native]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Block when an upstream gate did not pass
        shell: bash
        env:
          DESKTOP_RESULT: ${{ needs.desktop_candidate.result }}
          ANDROID_RESULT: ${{ needs.android_native.result }}
          WINDOWS_RESULT: ${{ needs.windows_native.result }}
        run: |
          if [[ "$DESKTOP_RESULT" != "success" || \
                "$ANDROID_RESULT" != "success" || \
                "$WINDOWS_RESULT" != "success" ]]; then
            echo "::error title=V2 daily candidate BLOCKED::desktop=$DESKTOP_RESULT android=$ANDROID_RESULT windows=$WINDOWS_RESULT"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Evaluate repository-local automated gates only
        run: python tools/v2_daily_readiness.py --source-only

  candidate_bundle:
    name: Assemble downloadable unsigned internal candidate
    needs: [desktop_candidate, android_native, windows_native, automated_readiness]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download Android candidate
        uses: actions/download-artifact@v8
        with:
          name: clipvault-v2-android-unsigned-candidate
          path: candidate-input/android

      - name: Download Windows IME candidate
        uses: actions/download-artifact@v8
        with:
          name: clipvault-v2-windows-ime-unsigned-candidate
          path: candidate-input/windows

      - name: Download Desktop candidate
        uses: actions/download-artifact@v8
        with:
          name: clipvault-v2-desktop-unsigned-candidate
          path: candidate-input/desktop

      - name: Reconstruct installer inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\desktop\dist -Force | Out-Null
          Copy-Item -LiteralPath .\candidate-input\desktop\ClipVault-Desktop-v2-unsigned.exe `
            -Destination .\desktop\dist\clipvault.exe -Force
          New-Item -ItemType Directory -Path .\desktop\packaging\runtime-notices -Force | Out-Null
          Copy-Item -Path .\candidate-input\desktop\runtime-notices\* `
            -Destination .\desktop\packaging\runtime-notices -Recurse -Force
          $imePackage = Join-Path $env:RUNNER_TEMP 'clipvault-ime-package'
          New-Item -ItemType Directory -Path $imePackage -Force | Out-Null
          Expand-Archive -LiteralPath .\candidate-input\windows\ClipVault-Windows-IME-v2-unsigned.zip `
            -DestinationPath $imePackage
          "CLIPVAULT_IME_PACKAGE=$imePackage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y

      - name: Compile unsigned internal v2 installer candidate
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC is missing: $iscc" }
          $version = (Get-Content -LiteralPath .\contracts\v2_candidate_version.json -Raw | ConvertFrom-Json).version_name
          & $iscc "/DAppVersion=$version" "/DClipVaultImeV2PackageDir=$env:CLIPVAULT_IME_PACKAGE" .\installer\clipvault-v2-daily.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Stage with BUILD_RECEIPT.json, RELEASE_MANIFEST.json and SHA256SUMS.txt
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\contracts\v2_candidate_version.json -Raw | ConvertFrom-Json).version_name
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'artifacts\v2-daily\bundle'
          New-Item -ItemType Directory -Path $candidate -Force | Out-Null
          Copy-Item -LiteralPath .\candidate-input\android\ClipVault-IME-v2-unsigned.apk -Destination $candidate
          Copy-Item -LiteralPath .\candidate-input\android\ClipVault-Runtime-v2-unsigned.apk -Destination $candidate
          Copy-Item -LiteralPath .\candidate-input\windows\ClipVault-Windows-IME-v2-unsigned.zip -Destination $candidate
          Copy-Item -LiteralPath .\candidate-input\desktop\ClipVault-Desktop-v2-unsigned.exe -Destination $candidate
          $installer = @(Get-ChildItem -LiteralPath .\installer\dist-v2 -Filter 'ClipVault-v2-Daily-Setup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected one v2 installer candidate, found: $installer" }
          Copy-Item -LiteralPath $installer[0].FullName -Destination $candidate
          @(
            'UNSIGNED INTERNAL V2 DAILY-USE CANDIDATE',
            'This artifact is not a release and has not passed Owner signing or manual QA gates.',
            'Compiling the installer does not install, register, or run the Windows IME.'
          ) | Set-Content -LiteralPath (Join-Path $candidate 'CANDIDATE-NOT-A-RELEASE.txt') -Encoding UTF8
          python .\tools\v2_daily_candidate.py `
            --root . `
            write-receipt `
            --artifact-dir $candidate `
            --source-commit '${{ github.sha }}' `
            --source-ref '${{ github.ref }}' `
            --repository '${{ github.repository }}' `
            --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw "V2 candidate receipt generation failed with exit code $LASTEXITCODE" }
          python .\scripts\release_candidate_manifest.py `
            --artifact-dir $candidate `
            --platform v2-daily `
            --version $version `
            --commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw "V2 candidate manifest generation failed with exit code $LASTEXITCODE" }
          python .\tools\v2_daily_candidate.py `
            --root . `
            verify `
            --artifact-dir $candidate `
            --expected-commit '${{ github.sha }}' `
            --expected-run-id '${{ github.run_id }}'
          if ($LASTEXITCODE -ne 0) { throw "V2 candidate manifest verification failed with exit code $LASTEXITCODE" }
          python .\tools\v2_daily_readiness.py `
            --automated-only `
            --candidate-dir $candidate
          if ($LASTEXITCODE -ne 0) { throw "V2 unified candidate readiness failed with exit code $LASTEXITCODE" }

      - name: Upload unified unsigned internal candidate
        uses: actions/upload-artifact@v7
        with:
          name: clipvault-v2-daily-unsigned-candidate
          path: artifacts/v2-daily/bundle/
          if-no-files-found: error
          retention-days: 14
