name: Sohu LM Odin Probe

on:
  push:
    paths:
      - '.github/workflows/sohu-lm-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Odin page 2
        run: |
          python - <<'PY'
          import hashlib, hmac, json, random, re, string, time
          import requests

          PROFILE='https://mp.sohu.com/profile?xpt=RDM4QjdFRURBRDdBRERCMTgxRjFFRjVFRkNBMTg5NDFAcXEuc29odS5jb20='
          ODIN='https://odin.sohu.com/odin/api/blockdata'
          KEY='FeedSlideloadAuthor_2_0_pc_1655965929143_data2'
          SECRET=b'439642a904ef43d092d45509cdc4391c'

          def rand(n):
              chars='ABCDEFGHJKMNPQRSTWXYZabcdefhijkmnprstwxyz2345678'
              return ''.join(random.choice(chars) for _ in range(n))

          def asid():
              ms=int(time.time()*1000)
              sig=hmac.new(SECRET, f't{ms}'.encode(), hashlib.sha1).hexdigest()
              return f'v1{ms}{sig}'

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          pr=s.get(PROFILE,timeout=30)
          pr.raise_for_status()
          html=pr.text
          pv=re.search(r'"pvId":"([^"]+)"',html)
          pv_id=pv.group(1) if pv else f'{int(time.time()*1000)}_{rand(7)}'
          now=int(time.time()*1000)
          body={
            'pvId':pv_id,
            'pageId':f'{now}_1612268936507{rand(3)}',
            'mainContent':{
              'productType':'13','productId':'324','secureScore':'5','categoryId':'47','adTags':'11111111','authorId':121135924
            },
            'resourceList':[{
              'tplCompKey':KEY,
              'isServerRender':True,
              'isSingleAd':False,
              'configSource':'mp',
              'content':{
                'productId':'325','productType':'13','size':20,'pro':'0,1,3,4,5','feedType':'XTOPIC_SYNTHETICAL',
                'view':'operateFeedMode','innerTag':'work','spm':'smpc.channel_248.block3_308_hHsK47_2_fd',
                'page':2,'requestId':f'{now}{rand(7)}_324'
              },
              'adInfo':{},'context':{'mkey':'252291'}
            }],
            'asId':asid()
          }
          headers={'Content-Type':'application/json','Referer':PROFILE}
          rr=s.post(ODIN,json=body,headers=headers,timeout=30)
          out={'http_status':rr.status_code,'cookies':sorted(s.cookies.keys())}
          try:
              data=rr.json()
              out['top_keys']=list(data.keys())
              node=(data.get('data') or {}).get(KEY) or {}
              items=node.get('list') or []
              out['count']=len(items)
              out['items']=[{'id':x.get('id'),'title':x.get('title'),'postTime':x.get('postTime')} for x in items]
              out['node_keys']=list(node.keys())
          except Exception as e:
              out['parse_error']=repr(e)
              out['body_prefix']=rr.text[:2000]
          print(json.dumps(out,ensure_ascii=False,indent=2))
          import os
          os.makedirs('tmp/sohu-lm-probe',exist_ok=True)
          open('tmp/sohu-lm-probe/page2.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/sohu-lm-probe/page2.json
          git commit -m 'Update Sohu LM Odin probe' || exit 0
          git push
