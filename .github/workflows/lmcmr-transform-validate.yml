name: LMCMR Transform Validation

on:
  push:
    paths:
      - '.github/workflows/lmcmr-transform-validate.yml'
      - 'tmp/lmcmr_transform_validate.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tmp/lmcmr_transform_validate.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/lmcmr-title-export/reconstruction_validation.json
          git commit -m 'Update LMCMR reconstruction validation' || exit 0
          git push
