name: LMCMR Final Package

on:
  push:
    paths:
      - '.github/workflows/lmcmr-package-final.yml'
      - 'tmp/lmcmr_package_final.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tmp/lmcmr_package_final.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/lmcmr-title-export
          git commit -m 'Build final LMCMR title package' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: LMCMR-2025-2026-report-titles
          path: tmp/lmcmr-title-export/LMCMR_2025_2026_report_titles.zip
          retention-days: 7
