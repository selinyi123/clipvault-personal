name: LMCMR Title Export

on:
  push:
    paths:
      - '.github/workflows/lmcmr-title-export.yml'
      - 'tmp/lmcmr_title_export.py'
  workflow_dispatch:

concurrency:
  group: lmcmr-title-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mark running
        run: |
          mkdir -p tmp/lmcmr-title-export
          printf '{"status":"running","started_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > tmp/lmcmr-title-export/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/lmcmr-title-export/status.json
          git commit -m 'LMCMR title export running' || true
          git push
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Export titles
        run: python tmp/lmcmr_title_export.py
      - name: Persist results
        run: |
          cp tmp/lmcmr-title-export/summary.json tmp/lmcmr-title-export/status.json
          git add tmp/lmcmr-title-export
          git commit -m 'Update LMCMR title export results' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: lmcmr-report-titles-2025-2026
          path: tmp/lmcmr-title-export/
          retention-days: 7
