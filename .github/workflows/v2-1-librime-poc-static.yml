name: v2.1 librime PoC static gate

on:
  pull_request:
    paths:
      - "spikes/librime-android/**"
      - ".github/workflows/v2-1-librime-poc-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate lock and synthetic vectors
        run: python spikes/librime-android/tools/validate_poc.py
      - name: Validate native JNI contract
        run: python spikes/librime-android/tools/validate_native_contract.py
      - name: Compile PoC validation tools
        run: |
          python -m py_compile \
            spikes/librime-android/tools/validate_poc.py \
            spikes/librime-android/tools/validate_native_contract.py \
            spikes/librime-android/tools/check_elf_alignment.py
