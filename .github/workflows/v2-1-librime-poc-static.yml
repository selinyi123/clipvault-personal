name: v2.1 librime PoC static gate

on:
  pull_request:
    paths:
      - "spikes/librime-android/**"
      - ".github/workflows/v2-1-librime-poc-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lock and synthetic vectors
        run: python spikes/librime-android/tools/validate_poc.py
